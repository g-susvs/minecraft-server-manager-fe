<div
  class="flex w-full items-start gap-3 rounded-xl border p-4 {{ bannerClass() }}"
  role="status"
>
  <span class="mt-1.5 size-2 shrink-0 rounded-full {{ dotClass() }}" aria-hidden="true"></span>
  <div class="min-w-0">
    <p class="text-sm font-semibold text-[#F1F5F9]">{{ title() }}</p>
    <p class="mt-0.5 text-xs leading-relaxed text-[#94A3B8]">{{ message() }}</p>
  </div>
</div>
