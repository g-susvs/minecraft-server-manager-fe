<a
  [routerLink]="['/servers', server().id]"
  class="flex items-center gap-4 rounded-xl border border-[#2D3F56] bg-[#1A2332] p-4 transition hover:border-[#4AA63D] focus-visible:outline-2 focus-visible:outline-[#4AA63D]"
>
  <div class="flex min-w-0 flex-1 flex-col gap-2">
    <span class="truncate text-base font-semibold text-[#F1F5F9]">{{ server().name }}</span>
    <app-status-badge [status]="server().status" />
  </div>

  <svg class="size-5 shrink-0 text-[#64748B]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <path d="m9 18 6-6-6-6" />
  </svg>
</a>
